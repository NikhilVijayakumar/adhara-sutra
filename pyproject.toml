[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nikhi-adhara-sutra"
version = "0.1.0"
description = "A CLI-first Python application framework"
requires-python = ">=3.12"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]
